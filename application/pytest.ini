# Bắt đầu nhóm cấu hình dành cho công cụ pytest.
[pytest]
# Khi không chỉ định đường dẫn, tìm bài kiểm thử trong thư mục tests cạnh file cấu hình.
testpaths = tests
# Tự thêm -ra: cuối lượt chạy hiển thị tóm tắt các kết quả không phải passed.
addopts = -ra
# Khai báo các nhãn được phép dùng để phân nhóm bài kiểm thử.
markers =
# Nhãn integration dành cho kiểm tra tích hợp nhanh với MTCNN thật đi kèm dự án.
    integration: real bundled MTCNN smoke test
